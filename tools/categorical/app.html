}

function computeAB() {
  const host = document.getElementById('ab-results');
  if (!host) return;
  host.innerHTML = '';
  const { nA, xA, nB, xB, alpha, a0, b0 } = abState;
  if (![nA, xA, nB, xB].every(isFinite) || nA <= 0 || nB <= 0 || xA < 0 || xA > nA || xB < 0 || xB > nB) {
    host.appendChild(el('div', { class: 'card' }, ['入力値を確認してください（0 ≤ x ≤ n、n > 0、すべて有限の数値）。']));
    return;
  }
  const pA = xA / nA, pB = xB / nB;
  const diff = pB - pA;

  // 頻度論: プールした2標本比率のz検定（2x2のカイ二乗検定と同値）
  const pooledP = (xA + xB) / (nA + nB);
  const seP = Math.sqrt(pooledP * (1 - pooledP) * (1 / nA + 1 / nB));
  const z = seP > 0 ? diff / seP : 0;
  const pval = 2 * (1 - Stat.normalCDF(Math.abs(z)));
  const zCrit = Stat.normalQuantile(1 - alpha / 2);
  const seUnpooled = Math.sqrt(pA * (1 - pA) / nA + pB * (1 - pB) / nB);
  const diffCI = [diff - zCrit * seUnpooled, diff + zCrit * seUnpooled];
  const rr = pA > 0 ? pB / pA : NaN;
  const oddsA = xA / Math.max(nA - xA, 0.5), oddsB = xB / Math.max(nB - xB, 0.5);
  const orVal = oddsB / oddsA;
  const seLogOR = Math.sqrt(1 / Math.max(xA, 0.5) + 1 / Math.max(nA - xA, 0.5) + 1 / Math.max(xB, 0.5) + 1 / Math.max(nB - xB, 0.5));
  const orCI = [Math.exp(Math.log(orVal) - zCrit * seLogOR), Math.exp(Math.log(orVal) + zCrit * seLogOR)];

  // ベイズ: 独立なBeta事後分布からモンテカルロ標本抽出
  const aA = a0 + xA, bA = b0 + (nA - xA), aB = a0 + xB, bB = b0 + (nB - xB);
  const nDraws = abState.nDraws;
  let diffs = new Array(nDraws), countBgtA = 0;
  for (let i = 0; i < nDraws; i++) {
    const pa = Stat.sampleBeta(aA, bA), pb = Stat.sampleBeta(aB, bB);
    diffs[i] = pb - pa;
    if (pb > pa) countBgtA++;
  }
  diffs.sort((x, y) => x - y);
  const qLo = diffs[Math.floor((alpha / 2) * nDraws)], qHi = diffs[Math.floor((1 - alpha / 2) * nDraws)];
  const postProbBgtA = countBgtA / nDraws;
  const postMeanA = aA / (aA + bA), postMeanB = aB / (aB + bB);
  const credLevel = 1 - alpha;

  // BIC近似ベイズファクター（H0: pA=pB 対 H1: pA≠pB）— 2×2分割表と同じ考え方
  const cross = Stat.contingencyChiSq([[xA, nA - xA], [xB, nB - xB]]);
  const bic = Stat.bicBayesFactor(cross.chi2, cross.df, nA + nB);
  const BF01 = bic.BF_indep_over_dep; // 「独立（差なし）：依存（差あり）」に対応
  const BF10 = 1 / BF01;
  const postProbNoDiff = BF01 / (BF01 + 1);

  const grid = el('div', { class: 'compare-grid' });
  grid.appendChild(el('div', { class: 'panel freq' }, [
    el('div', { class: 'panel-head' }, [el('span', { class: 'tag' }, ['頻度論']), el('h3', {}, ['2標本比率のz検定'])]),
    statLine(`${abState.nameA} 比率`, fmt(pA, 4)),
    statLine(`${abState.nameB} 比率`, fmt(pB, 4)),
    statLine('比率差 (B − A)', fmt(diff, 4)),
    statLine(`${pct(credLevel, 0)} 信頼区間（差）`, `[${fmt(diffCI[0], 4)}, ${fmt(diffCI[1], 4)}]`),
    statLine('相対リスク (B/A)', fmt(rr, 3)),
    statLine('オッズ比 (B/A)', `${fmt(orVal, 3)} [${fmt(orCI[0], 3)}, ${fmt(orCI[1], 3)}]`),
    statLine('z統計量 / p値', `z=${fmt(z, 3)}, ${fmtp(pval)}`),
    el('div', { class: 'verdict ' + (pval < alpha ? 'bad' : 'good') }, [
      pval < alpha
        ? `p = ${fmtp(pval)} < α = ${alpha} → 2群間の比率に有意差あり`
        : `p = ${fmtp(pval)} ≥ α = ${alpha} → 有意差は認められない`
    ]),
  ]));
  grid.appendChild(el('div', { class: 'panel bayes' }, [
    el('div', { class: 'panel-head' }, [el('span', { class: 'tag' }, ['ベイズ']), el('h3', {}, ['独立Beta事後分布（モンテカルロ）'])]),
    statLine(`${abState.nameA} 事後平均`, fmt(postMeanA, 4)),
    statLine(`${abState.nameB} 事後平均`, fmt(postMeanB, 4)),
    statLine(`${pct(credLevel, 0)} 信用区間（差）`, `[${fmt(qLo, 4)}, ${fmt(qHi, 4)}]`),
    statLine(`P(${abState.nameB} > ${abState.nameA} | データ)`, pct(postProbBgtA, 1)),
    statLine('ベイズファクター BF₁₀（差あり 対 差なし）', fmt(BF10, 4)),
    el('div', { class: 'verdict ' + (BF10 > 3 || BF10 < 1 / 3 ? (BF10 > 1 ? 'bad' : 'good') : '') }, [
      BF10 >= 1
        ? `データは「差あり」を「差なし」の ${fmt(BF10, 2)} 倍支持 — ${kassRaftery(BF10)}`
        : `データは「差なし」を「差あり」の ${fmt(1 / BF10, 2)} 倍支持 — ${kassRaftery(BF10)}`
    ]),
  ]));
  host.appendChild(grid);

  host.appendChild(el('div', { class: 'card axis-block' }, [
    el('div', { class: 'axis-title' }, ['同一軸上の比率比較']),
    intervalTwin({
      axisMin: 0, axisMax: 1,
      freqIv: { lo: Math.max(0, pA - zCrit * Math.sqrt(pA * (1 - pA) / nA)), hi: Math.min(1, pA + zCrit * Math.sqrt(pA * (1 - pA) / nA)), point: pA },
      bayesIv: { lo: Stat.betaQuantile(alpha / 2, aB, bB), hi: Stat.betaQuantile(1 - alpha / 2, aB, bB), point: postMeanB },
      refLine: pA, refLabel: `${abState.nameA}=${fmt(pA, 3)}`,
      freqLabel: `${abState.nameA} CI`, bayesLabel: `${abState.nameB} CrI`,
      tickFmt: v => v.toFixed(2)
    })
  ]));
  host.appendChild(el('div', { class: 'card axis-block' }, [
    el('div', { class: 'axis-title' }, ['p値の位置 と 「差あり」事後確率の位置']),
    evidenceAxis({ pValue: pval, postProb: 1 - postProbNoDiff, alpha })
  ]));

  host.appendChild(el('div', { class: 'interp' }, [
    el('h4', {}, ['読み方']),
    el('div', { class: 'small-note' }, [
      'A/Bテストは本質的に2×2分割表の独立性検定と同じデータ構造ですが、群間の「差の大きさ」（比率差・相対リスク・オッズ比）を主役に置く点が特徴です。頻度論はプールした分散を用いた2標本比率のz検定（2×2のカイ二乗検定と数学的に同値）で、信頼区間には非プール分散（Wald法）を使用しています。ベイズ側は両群を独立なBeta事後分布として推定し、モンテカルロ抽出により「Bの方が大きい事後確率」や比率差の信用区間を求めています。ベイズファクターは分割表タブと同じBIC近似を使用しており、JASPの',
      el('code', {}, ['abtest']),
      ' パッケージが用いる情報事前分布（log odds比への正規事前分布）による厳密なベイズファクターとは異なる近似値である点に注意してください（Rコードで比較できます）。'
    ])
  ]));

  const freqText = `${abState.nameA}（n=${nA}, x=${xA}, 比率=${fmt(pA, 3)}）と${abState.nameB}（n=${nB}, x=${xB}, 比率=${fmt(pB, 3)}）の比率を2標本z検定で比較したところ、両群の比率は${pval < alpha ? '統計的に有意に異なっていた' : '統計的に有意には異ならなかった'}（z = ${fmt(z, 2)}, p = ${fmtp(pval)}, 比率差の${pct(credLevel, 0)}信頼区間 [${fmt(diffCI[0], 3)}, ${fmt(diffCI[1], 3)}]）。`;
  const bayesText = `ベイズ的分析では、両群独立のBeta事後分布から比率差の${pct(credLevel, 0)}信用区間は [${fmt(qLo, 3)}, ${fmt(qHi, 3)}] と推定され、P(${abState.nameB} > ${abState.nameA} | データ) = ${pct(postProbBgtA, 1)} であった。BIC近似ベイズファクターは BF₁₀ = ${fmt(BF10, 3)} であり、${BF10 >= 1 ? '差があるモデル' : '差がないモデル'}を支持する${bfStrengthWord(BF10)}証拠と解釈された。`;
  host.appendChild(manuscriptExample(freqText, bayesText));

  const rCode = `# ==== データ ====
nA <- ${rNum(nA, 0)}; xA <- ${rNum(xA, 0)}   # ${abState.nameA}
nB <- ${rNum(nB, 0)}; xB <- ${rNum(xB, 0)}   # ${abState.nameB}
alpha <- ${rNum(alpha)}

# ==== 頻度論: 2標本比率のz検定（prop.test） ====
freq_result <- prop.test(c(xA, xB), c(nA, nB), correct = FALSE)
print(freq_result)

# オッズ比・相対リスク（epitoolsパッケージ等でも計算可）
pA <- xA / nA; pB <- xB / nB
rr <- pB / pA
or_val <- (xB / (nB - xB)) / (xA / (nA - xA))
cat("相対リスク:", rr, " オッズ比:", or_val, "\\n")

# ==== ベイズ: 独立Beta事後分布によるモンテカルロ推定 ====
a0 <- ${rNum(a0)}; b0 <- ${rNum(b0)}
set.seed(1)
draws <- 100000
pa_draws <- rbeta(draws, a0 + xA, b0 + (nA - xA))
pb_draws <- rbeta(draws, a0 + xB, b0 + (nB - xB))
diff_draws <- pb_draws - pa_draws
cat("P(B > A):", mean(pb_draws > pa_draws), "\\n")
cat("差の", 100 * (1 - alpha), "%信用区間:", quantile(diff_draws, c(alpha / 2, 1 - alpha / 2)), "\\n")

# ==== JASP同様、informed prior による厳密なベイズファクター（abtestパッケージ） ====
if (!requireNamespace("abtest", quietly = TRUE)) install.packages("abtest", repos = "https://cloud.r-project.org")
library(abtest)
ab <- ab_test(data = list(y1 = xA, n1 = nA, y2 = xB, n2 = nB))
print(ab)
# plot(ab)  # 事前分布・事後分布・BFの可視化
`;
  host.appendChild(rCodeBlock('A/BテストのRコード', rCode));
}

const informedMultiState = {
  rows: [
    { name: 'カテゴリA', obs: 50, rank: 1 },
    { name: 'カテゴリB', obs: 30, rank: 2 },
    { name: 'カテゴリC', obs: 20, rank: 3 },
  ],
  concEach: 1,
  alpha: 0.05,
  nDraws: 50000,
  inputMode: 'individual', rawVariables: null, rawRecords: null, rawExcluded: null, selectedVarName: null,
};

function parseInformedMultiAggregateCSV(text) {
  const rows = parseCSV(text);
  if (!rows.length) throw new Error('データが空です');
  let dataRows = rows.slice();
  if (dataRows[0].length >= 2 && !isNumericCell(dataRows[0][1])) dataRows = dataRows.slice(1);
  if (dataRows.length < 3) throw new Error('カテゴリは3つ以上必要です');
  const hasRank = dataRows.every(r => r.length >= 3 && isNumericCell(r[2]));
  return dataRows.map((r, i) => ({
    name: r[0] || ('カテゴリ' + (i + 1)),
    obs: isNumericCell(r[1]) ? Number(r[1]) : 0,
    rank: hasRank ? Number(r[2]) : i + 1,
  }));
}
function applyInformedMultiParsedText(text, mode) {
  if (mode === 'individual') {
    const parsed = parseIndividualMultiCSV(text);
    informedMultiState.rawVariables = parsed.variables;
    informedMultiState.rawRecords = parsed.records;
    informedMultiState.rawExcluded = parsed.excludedCols;
    if (!informedMultiState.selectedVarName || !parsed.variables.some(v => v.name === informedMultiState.selectedVarName)) {
      informedMultiState.selectedVarName = parsed.variables[0].name;
    }
    syncInformedMultiFromSelectedVariable();
  } else {
    informedMultiState.rows = parseInformedMultiAggregateCSV(text);
    informedMultiState.rawVariables = null;
  }
  renderInformedMultiVarSelector();
  renderInformedMultiTable(); computeInformedMulti();
}
function syncInformedMultiFromSelectedVariable() {
  const v = informedMultiState.rawVariables.find(v => v.name === informedMultiState.selectedVarName);
  const counts = {};
  v.levels.forEach(l => { counts[l] = 0; });
  informedMultiState.rawRecords.forEach(rec => { const val = rec[v.name]; if (val in counts) counts[val]++; });
  informedMultiState.rows = v.levels.map((label, i) => ({ name: label, obs: counts[label], rank: i + 1 }));
}
function renderInformedMultiVarSelector() {
  const host = document.getElementById('im-var-selector-host');
  if (!host) return;
  host.innerHTML = '';
  if (!informedMultiState.rawVariables) return;
  const children = [];
  if (informedMultiState.rawExcluded && informedMultiState.rawExcluded.length) {
    children.push(el('div', { class: 'small-note', style: 'margin-bottom:8px;' }, [
      `個体識別子とみなして自動的に除外した列: ${informedMultiState.rawExcluded.map(c => `「${c.name}」（一意な値 ${c.uniqueCount}件）`).join('、')}`
    ]));
  }
  if (informedMultiState.rawVariables.length > 1) {
    const select = el('select', { class: 'select-input' });
    informedMultiState.rawVariables.forEach(v => {
      const opt = el('option', { value: v.name }, [`${v.name}（${v.levels.length}カテゴリ）`]);
      if (v.name === informedMultiState.selectedVarName) opt.setAttribute('selected', 'selected');
      select.appendChild(opt);
    });
    select.addEventListener('change', () => {
      informedMultiState.selectedVarName = select.value;
      syncInformedMultiFromSelectedVariable();
      renderInformedMultiTable(); computeInformedMulti();
    });
    children.push(el('div', { class: 'field' }, [el('label', {}, ['集計する変数を選択（複数のカテゴリ列が見つかりました）']), select]));
  }
  if (children.length) host.appendChild(el('div', { class: 'card', style: 'background:#FAFAF8;' }, children));
}

function renderInformedMultiTab() {
  const root = el('div', { class: 'tab-panel', id: 'panel-informed_multi' });
  const card = el('div', { class: 'card' }, [
    el('h2', {}, ['データ入力：Informed 多項検定']),
    el('div', { class: 'desc' }, ['3つ以上のカテゴリについて、観測度数と「想定する順序」（順位）を入力してください。順位は1（最大）〜k（最小）の並び替えとして指定します。例えば p₁ > p₂ > p₃ という仮説なら、カテゴリ1に順位1、カテゴリ2に順位2、カテゴリ3に順位3を割り当てます。個票データを読み込むと度数分布表を自動作成します（順位は仮の値が入るため、読み込み後に編集してください）。']),
    el('div', { id: 'im-var-selector-host' }),

      field('Dirichlet事前濃度（各カテゴリ共通）', 'number', informedMultiState.concEach, v => { informedMultiState.concEach = Math.max(0.01, +v); computeInformedMulti(); }, 'im-conc', '順序制約の事前確率 1/k! を仮定するため全カテゴリで共通の値を使用', 0.5),
    ]),

    createDropZone(
      '個票データ（1行=1個体、1列以上。ID列は自動除外）、または集計済みの「カテゴリ名,観測度数,[順位]」',
      (text) => applyInformedMultiParsedText(text, informedMultiState.inputMode)
    ),
    el('div', { class: 'input-divider' }, ['または貼り付け']),
    createPasteArea(
      '個票データの例（1行=1個体）:\nresponse\nA\nB\nA\nC\n...\n\n集計済みの例（順位は省略可）:\ncategory,count,rank\nカテゴリA,50,1\nカテゴリB,30,2\nカテゴリC,20,3',
      (text) => applyInformedMultiParsedText(text, informedMultiState.inputMode)
    ),
  ]);
  root.appendChild(card);
  root.appendChild(el('div', { id: 'im-results' }));
  return root;
}
function renderInformedMultiTable() {
  const host = document.getElementById('im-table-host');
  if (!host) return;
  host.innerHTML = '';
  const table = el('table', { class: 'dtable' });
  table.appendChild(el('tr', {}, [el('th', {}, ['カテゴリ名']), el('th', {}, ['観測度数']), el('th', {}, ['順位（1=最大）']), el('th', {}, [''])]));
  informedMultiState.rows.forEach((row, i) => {
    const nameInput = el('input', { type: 'text', value: row.name });
    nameInput.addEventListener('input', () => { row.name = nameInput.value; computeInformedMulti(); });
    const obsInput = el('input', { type: 'number', value: row.obs, min: '0' });
    obsInput.addEventListener('input', () => { row.obs = +obsInput.value; computeInformedMulti(); });
    const rankInput = el('input', { type: 'number', value: row.rank, min: '1', step: '1' });
    rankInput.addEventListener('input', () => { row.rank = +rankInput.value; computeInformedMulti(); });
    const delBtn = el('button', { class: 'row-del' }, ['✕']);
    delBtn.addEventListener('click', () => {
      if (informedMultiState.rows.length <= 3) return;
      informedMultiState.rows.splice(i, 1); renderInformedMultiTable(); computeInformedMulti();
    });
    table.appendChild(el('tr', {}, [el('td', {}, [nameInput]), el('td', {}, [obsInput]), el('td', {}, [rankInput]), el('td', {}, [delBtn])]));
  });
  host.appendChild(table);
}
function validateRanks(rows) {
  const k = rows.length;
  const ranks = rows.map(r => r.rank);
  const sorted = ranks.slice().sort((a, b) => a - b);
  for (let i = 0; i < k; i++) if (sorted[i] !== i + 1) return false;
  return true;
}
function computeInformedMulti() {
  const host = document.getElementById('im-results');
  if (!host) return;
  host.innerHTML = '';
  const rows = informedMultiState.rows;
  const obs = rows.map(r => r.obs);
  const k = rows.length;
  const alpha = informedMultiState.alpha;
  if (k < 3 || obs.some(o => !isFinite(o) || o < 0)) {
    host.appendChild(el('div', { class: 'card' }, ['入力値を確認してください（カテゴリは3つ以上、度数は0以上の有限の数値）。']));
    return;
  }
  if (!validateRanks(rows)) {
    host.appendChild(el('div', { class: 'card' }, [`順位が正しくありません。1〜${k}を1回ずつ使う並び替えにしてください。`]));
    return;
  }
  const n = obs.reduce((a, b) => a + b, 0);
  const rankOrder = rows.map((r, i) => i).sort((a, b) => rows[a].rank - rows[b].rank); // 大きい順のインデックス列
  const alphaVec = rows.map(() => informedMultiState.concEach);
  const uniformP0 = rows.map(() => 1 / k);

  // 等質性検定（H0: 全カテゴリ均等）— 既存の多項検定と同じ枠組み
  const gof = Stat.chiSqGOF(obs, uniformP0);
  const logml1 = Stat.dirichletMultinomialLogML(obs, alphaVec);
  const logml0 = Stat.multinomialLogLikNull(obs, uniformP0);
  const BF_u0 = Math.exp(logml1 - logml0); // 自由推定(u) 対 均等(0)

  // 順序制約つきベイズファクター（エンカプシング事前分布法, モンテカルロ）
  const nDraws = informedMultiState.nDraws;
  const priorProb = Stat.orderConstraintProb(() => Stat.sampleDirichlet(alphaVec), rankOrder, nDraws);
  const alphaPost = rows.map((r, i) => alphaVec[i] + obs[i]);
  const postProb = Stat.orderConstraintProb(() => Stat.sampleDirichlet(alphaPost), rankOrder, nDraws);
  const priorProbSafe = Math.max(priorProb, 1 / nDraws);
  const postProbSafe = Math.max(postProb, 1 / nDraws);
  const BF_1u = postProbSafe / priorProbSafe;
  const BF_10 = BF_1u * BF_u0;

  // 3モデルの事後確率（事前モデル確率1:1:1と仮定）: Hu, H1(順序), H0(均等)
  const wU = 1, w1 = BF_1u, w0 = 1 / BF_u0;
  const wsum = wU + w1 + w0;
  const postProbU = wU / wsum, postProb1 = w1 / wsum, postProb0 = w0 / wsum;

  // 頻度論の代替: 隣接順位ペアの片側z検定（Intersection-Union法）
  const pHat = obs.map(o => o / n);
  const pairTests = [];
  for (let j = 0; j < rankOrder.length - 1; j++) {
    const i1 = rankOrder[j], i2 = rankOrder[j + 1];
    const p1 = pHat[i1], p2 = pHat[i2];
    const varDiff = ((p1 + p2) - (p1 - p2) * (p1 - p2)) / n; // 同一多項標本内の共分散を考慮
    const zStat = varDiff > 0 ? (p1 - p2) / Math.sqrt(varDiff) : (p1 > p2 ? Infinity : 0);
    const pOneSided = 1 - Stat.normalCDF(zStat);
    pairTests.push({ nameHi: rows[i1].name, nameLo: rows[i2].name, p1, p2, z: zStat, p: pOneSided });
  }
  const iuP = Math.max(...pairTests.map(t => t.p)); // Intersection-Union: 最大のp値で判定
  const iuSupported = iuP < alpha;

  const grid = el('div', { class: 'compare-grid' });
  const ptRows = pairTests.map(t => `${t.nameHi}(${fmt(t.p1, 3)}) > ${t.nameLo}(${fmt(t.p2, 3)}): z=${fmt(t.z, 2)}, p=${fmtp(t.p)}`);
  grid.appendChild(el('div', { class: 'panel freq' }, [
    el('div', { class: 'panel-head' }, [el('span', { class: 'tag' }, ['頻度論（代替）']), el('h3', {}, ['隣接順位の片側検定（Intersection-Union法）'])]),
    ...ptRows.map(r => el('div', { class: 'stat-line', style: 'font-size:12.5px;' }, [el('span', { class: 'k' }, [r])])),
    statLine('均等性のカイ二乗検定 p値（参考）', fmtp(gof.pChi2)),
    el('div', { class: 'verdict ' + (iuSupported ? 'good' : 'bad') }, [
      iuSupported
        ? `すべての隣接ペアが有意（最大p = ${fmtp(iuP)} < α = ${alpha}）→ 指定した順序仮説を支持`
        : `一部の隣接ペアが非有意（最大p = ${fmtp(iuP)} ≥ α = ${alpha}）→ 順序仮説を統計的に支持できない`
    ]),
  ]));
  grid.appendChild(el('div', { class: 'panel bayes' }, [
    el('div', { class: 'panel-head' }, [el('span', { class: 'tag' }, ['ベイズ']), el('h3', {}, ['エンカプシング事前分布法（モンテカルロ）'])]),
    statLine('P(順序制約 | 事前分布)', fmt(priorProb, 4)),
    statLine('P(順序制約 | 事後分布)', fmt(postProb, 4)),
    statLine('BF₁ᵤ（順序制約 対 無制約）', fmt(BF_1u, 3)),
    statLine('BFᵤ₀（無制約 対 均等）', fmt(BF_u0, 3)),
    statLine('BF₁₀（順序制約 対 均等）', fmt(BF_10, 3)),
    statLine('事後モデル確率 [Hu, H₁順序, H₀均等]', `${pct(postProbU, 1)}, ${pct(postProb1, 1)}, ${pct(postProb0, 1)}`),
    el('div', { class: 'verdict ' + (BF_1u > 3 ? 'good' : (BF_1u < 1 / 3 ? 'bad' : '')) }, [
      BF_1u >= 1
        ? `データは順序制約仮説を無制約モデルの ${fmt(BF_1u, 2)} 倍支持 — ${kassRaftery(BF_1u)}`
        : `データは無制約モデルを順序制約仮説の ${fmt(1 / BF_1u, 2)} 倍支持 — ${kassRaftery(BF_1u)}`
    ]),
  ]));
  host.appendChild(grid);

  // カテゴリ別の内訳
  const mtable = el('table', { class: 'mtable' });
  mtable.appendChild(el('tr', {}, [el('th', {}, ['カテゴリ']), el('th', {}, ['指定順位']), el('th', {}, ['観測度数']), el('th', {}, ['観測比率']), el('th', {}, ['事後平均']), el('th', {}, [`ベイズ${pct(1 - alpha, 0)}CrI`])]));
  const marg = Stat.dirichletMarginalCI(obs, alphaVec, 1 - alpha);
  rows.forEach((r, i) => {
    mtable.appendChild(el('tr', {}, [
      el('td', {}, [r.name]), el('td', {}, [String(r.rank)]), el('td', {}, [String(obs[i])]),
      el('td', {}, [fmt(pHat[i], 3)]), el('td', {}, [fmt(marg[i].mean, 3)]), el('td', {}, [`[${fmt(marg[i].lo, 3)}, ${fmt(marg[i].hi, 3)}]`]),
    ]));
  });
  host.appendChild(el('div', { class: 'card' }, [el('h2', {}, ['カテゴリ別の内訳']), mtable]));

  host.appendChild(el('div', { class: 'interp' }, [
    el('h4', {}, ['読み方']),
    el('div', { class: 'small-note' }, [
      'Informed（順序制約つき）検定は、「どのカテゴリがどのカテゴリより多いか」という具体的な順序仮説を、順序を問わない自由推定モデル（Hu）や、全カテゴリが均等（H₀）というモデルと比較します。頻度論には順序制約検定の標準手法（カイ二乗混合分布によるorder-restricted尤度比検定）が存在しますが実装が複雑なため、ここでは近似的な代替として隣接する順位ペアそれぞれに片側2標本比率検定を行い、すべて有意であれば順序仮説を支持するとみなすIntersection-Union法を採用しています。ベイズ側は',
      el('code', {}, ['Klugkist & Hoijtink (2007)']),
      ' のエンカプシング事前分布法に基づき、無制約のDirichlet事前分布・事後分布それぞれから乱数を発生させ、指定した順序を満たす割合の比（事後÷事前）としてベイズファクターBF₁ᵤを推定しています（モンテカルロ標本数: ' + nDraws.toLocaleString() + '）。'
    ])
  ]));

  const orderText = rankOrder.map(i => rows[i].name).join(' > ');
  const freqText = `${k}つのカテゴリ（観測度数の合計 N = ${n}）について、順序仮説 ${orderText} を隣接順位ペアの片側検定（Intersection-Union法）で検討したところ、${iuSupported ? 'すべての隣接比較が有意であり（最大 p = ' + fmtp(iuP) + '）、指定した順序が統計的に支持された' : '一部の隣接比較が有意でなく（最大 p = ' + fmtp(iuP) + '）、指定した順序を統計的に支持する証拠は得られなかった'}。`;
  const bayesText = `ベイズ的分析では、エンカプシング事前分布法（Klugkist & Hoijtink, 2007）により、順序仮説 ${orderText} を支持するベイズファクターは無制約モデルに対して BF₁ᵤ = ${fmt(BF_1u, 3)}、均等モデルに対して BF₁₀ = ${fmt(BF_10, 3)} であり、${BF_1u >= 1 ? '順序仮説を支持する' : '順序仮説を支持しない'}${bfStrengthWord(BF_1u)}証拠と解釈された。`;
  host.appendChild(manuscriptExample(freqText, bayesText));

  const rCode = `# ==== データ（個票から作成した度数分布表） ====
observed <- ${rVec(obs)}
names(observed) <- ${rVec(rows.map(r => r.name))}
factor_levels <- ${rVec(rows.map(r => r.name))}   # observedと同じ並び順
# 指定した順序仮説（大きい順）: ${orderText}
alpha <- ${rNum(alpha)}

# ==== 頻度論（参考）: 均等性のカイ二乗適合度検定 ====
print(chisq.test(observed))

# ==== ベイズ: Informed 多項検定（multibridgeパッケージ） ====
if (!requireNamespace("multibridge", quietly = TRUE)) install.packages("multibridge", repos = "https://cloud.r-project.org")
library(multibridge)
# Hrは「小さい順」に "<" で連結して指定する（多重比較も "," や "&" でつなげられます）
Hr <- ${buildMultibridgeHrVec(rows.map(r => r.name), rankOrder)}
result <- mult_bf_informed(x = observed, Hr = Hr,
                            a = rep(${rNum(informedMultiState.concEach)}, length(observed)),
                            factor_levels = factor_levels, seed = 1, niter = 5000)
summary(result)

# ==== 上記と同じ考え方の簡易実装（エンカプシング事前分布法・モンテカルロ） ====
if (!requireNamespace("gtools", quietly = TRUE)) install.packages("gtools", repos = "https://cloud.r-project.org")
set.seed(1)
draws <- ${rNum(nDraws, 0)}
alpha_vec <- rep(${rNum(informedMultiState.concEach)}, length(observed))
prior_draws <- gtools::rdirichlet(draws, alpha_vec)
post_draws  <- gtools::rdirichlet(draws, alpha_vec + observed)
order_idx <- order(-c(${rankOrder.map(i => i + 1).join(', ')}))  # 大きい順のインデックス
check_order <- function(m) {
  apply(m, 1, function(p) all(diff(p[order_idx]) < 0))
}
prior_p <- mean(check_order(prior_draws))
post_p  <- mean(check_order(post_draws))
BF_1u <- post_p / prior_p
cat("BF_1u:", BF_1u, "\\n")
`;
  host.appendChild(rCodeBlock('Informed多項検定のRコード', rCode));
}

// ============================================================
// タブ7: Informed 多重二項検定（複数の独立した二項比率の順序制約検定）
// ============================================================
const informedBinomState = {
  rows: [
    { name: 'グループ1', n: 100, x: 70, rank: 1 },
    { name: 'グループ2', n: 100, x: 50, rank: 2 },
    { name: 'グループ3', n: 100, x: 30, rank: 3 },
  ],
  a0: 1, b0: 1,
  alpha: 0.05,
  nDraws: 50000,
  inputMode: 'individual', rawGroupVar: null, rawOutcomeVar: null, rawRecords: null, rawExcluded: null, successCategory: null,
};

function parseInformedBinomAggregateCSV(text) {
  const rows = parseCSV(text);
  if (!rows.length) throw new Error('データが空です');
  let dataRows = rows.slice();
  if (dataRows[0].length >= 2 && !isNumericCell(dataRows[0][1])) dataRows = dataRows.slice(1);
  if (dataRows.length < 3) throw new Error('グループは3つ以上必要です');
  const hasRank = dataRows.every(r => r.length >= 4 && isNumericCell(r[3]));
  return dataRows.map((r, i) => ({
    name: r[0] || ('グループ' + (i + 1)),
    n: Number(r[1]), x: Number(r[2]),
    rank: hasRank ? Number(r[3]) : i + 1,
  }));
}
function applyInformedBinomParsedText(text, mode) {
  if (mode === 'individual') {
    const parsed = detectCategoricalColumnsCSV(text, 2);
    const groupVar = parsed.variables[0], outcomeVar = parsed.variables[1];
    if (outcomeVar.levels.length !== 2) throw new Error('結果列は2水準（成功/失敗など）である必要があります');
    if (groupVar.levels.length < 3) throw new Error('グループ列は3水準（3グループ）以上が必要です。2グループの場合は「A/Bテスト」タブをご利用ください');
    informedBinomState.rawGroupVar = groupVar;
    informedBinomState.rawOutcomeVar = outcomeVar;
    informedBinomState.rawRecords = parsed.records;
    informedBinomState.rawExcluded = parsed.excludedCols;
    if (!informedBinomState.successCategory || !outcomeVar.levels.includes(informedBinomState.successCategory)) {
      informedBinomState.successCategory = outcomeVar.levels[0];
    }
    syncInformedBinomFromRaw();
  } else {
    informedBinomState.rows = parseInformedBinomAggregateCSV(text);
    informedBinomState.rawGroupVar = null;
  }
  renderInformedBinomFreqInfo();
  renderInformedBinomTable(); computeInformedBinom();
}
function syncInformedBinomFromRaw() {
  const gv = informedBinomState.rawGroupVar, ov = informedBinomState.rawOutcomeVar;
  const recs = informedBinomState.rawRecords, successCategory = informedBinomState.successCategory;
  informedBinomState.rows = gv.levels.map((gl, i) => {
    const groupRecs = recs.filter(r => r[gv.name] === gl);
    const n = groupRecs.length;
    const x = groupRecs.filter(r => r[ov.name] === successCategory).length;
    return { name: gl, n, x, rank: i + 1 };
  });
}
function renderInformedBinomFreqInfo() {
  const host = document.getElementById('ib-freq-info-host');
  if (!host) return;
  host.innerHTML = '';
  const gv = informedBinomState.rawGroupVar;
  if (!gv) return;
  const ov = informedBinomState.rawOutcomeVar;
  const children = [];
  if (informedBinomState.rawExcluded && informedBinomState.rawExcluded.length) {
    children.push(el('div', { class: 'small-note', style: 'margin-bottom:8px;' }, [
      `個体識別子とみなして自動的に除外した列: ${informedBinomState.rawExcluded.map(c => `「${c.name}」（一意な値 ${c.uniqueCount}件）`).join('、')}`
    ]));
  }
  const select = el('select', { class: 'select-input' });
  ov.levels.forEach(l => {
    const opt = el('option', { value: l }, [l]);
    if (l === informedBinomState.successCategory) opt.setAttribute('selected', 'selected');
    select.appendChild(opt);
  });
  select.addEventListener('change', () => {
    informedBinomState.successCategory = select.value;
    syncInformedBinomFromRaw();
    renderInformedBinomTable(); computeInformedBinom();
  });
  children.push(el('div', { class: 'desc' }, [`変数「${gv.name}」（群）×「${ov.name}」（結果）を集計しました。「成功」とみなす結果を選んでください。`]));
  children.push(el('div', { class: 'field' }, [el('label', {}, ['成功とみなす結果']), select]));
  host.appendChild(el('div', { class: 'card', style: 'background:#FAFAF8;' }, children));
}

function renderInformedBinomTab() {
  const root = el('div', { class: 'tab-panel', id: 'panel-informed_binom' });

    createDropZone(
      '個票データ（1行=1個体、2列：グループ・結果。ID列は自動除外）、または集計済みの「グループ名,n,x,[順位]」',
      (text) => applyInformedBinomParsedText(text, informedBinomState.inputMode)
    ),
    el('div', { class: 'input-divider' }, ['または貼り付け']),
    createPasteArea(
      '個票データの例（1行=1個体）:\ngroup,outcome\nグループ1,成功\nグループ1,失敗\nグループ2,成功\n...\n\n集計済みの例（順位は省略可）:\nname,n,x,rank\nグループ1,100,70,1\nグループ2,100,50,2\nグループ3,100,30,3',

    ),

  root.appendChild(card);
  root.appendChild(el('div', { id: 'ib-results' }));
  return root;
}
function renderInformedBinomTable() {
  const host = document.getElementById('ib-table-host');
  if (!host) return;
  host.innerHTML = '';
  const table = el('table', { class: 'dtable' });
  table.appendChild(el('tr', {}, [el('th', {}, ['グループ名']), el('th', {}, ['試行回数 n']), el('th', {}, ['成功数 x']), el('th', {}, ['順位（1=最大）']), el('th', {}, [''])]));
  informedBinomState.rows.forEach((row, i) => {
    const nameInput = el('input', { type: 'text', value: row.name });
    nameInput.addEventListener('input', () => { row.name = nameInput.value; computeInformedBinom(); });
    const nInput = el('input', { type: 'number', value: row.n, min: '0' });
    nInput.addEventListener('input', () => { row.n = +nInput.value; computeInformedBinom(); });
    const xInput = el('input', { type: 'number', value: row.x, min: '0' });
    xInput.addEventListener('input', () => { row.x = +xInput.value; computeInformedBinom(); });
    const rankInput = el('input', { type: 'number', value: row.rank, min: '1', step: '1' });
    rankInput.addEventListener('input', () => { row.rank = +rankInput.value; computeInformedBinom(); });
    const delBtn = el('button', { class: 'row-del' }, ['✕']);
    delBtn.addEventListener('click', () => {
      if (informedBinomState.rows.length <= 3) return;
      informedBinomState.rows.splice(i, 1); renderInformedBinomTable(); computeInformedBinom();
    });
    table.appendChild(el('tr', {}, [el('td', {}, [nameInput]), el('td', {}, [nInput]), el('td', {}, [xInput]), el('td', {}, [rankInput]), el('td', {}, [delBtn])]));
  });
  host.appendChild(table);
}
function computeInformedBinom() {
  const host = document.getElementById('ib-results');
  if (!host) return;
  host.innerHTML = '';
  const rows = informedBinomState.rows;
  const k = rows.length;
  const alpha = informedBinomState.alpha;
  const a0 = informedBinomState.a0, b0 = informedBinomState.b0;
  if (k < 3 || rows.some(r => !isFinite(r.n) || !isFinite(r.x) || r.n <= 0 || r.x < 0 || r.x > r.n)) {
    host.appendChild(el('div', { class: 'card' }, ['入力値を確認してください（グループは3つ以上、0 ≤ x ≤ n、n > 0）。']));
    return;
  }
  if (!validateRanks(rows)) {
    host.appendChild(el('div', { class: 'card' }, [`順位が正しくありません。1〜${k}を1回ずつ使う並び替えにしてください。`]));
    return;
  }
  const rankOrder = rows.map((r, i) => i).sort((a, b) => rows[a].rank - rows[b].rank);
  const pHat = rows.map(r => r.x / r.n);
  const N = rows.reduce((s, r) => s + r.n, 0);

  // 等質性検定（H0: 全グループの比率が等しい）— k×2分割表として扱う
  const table2 = rows.map(r => [r.x, r.n - r.x]);
  const cross = Stat.contingencyChiSq(table2);
  const bic = Stat.bicBayesFactor(cross.chi2, cross.df, N);
  const BF_0u = bic.BF_indep_over_dep; // 独立(=全比率等しい,0) 対 依存(=比率が異なる,u)
  const BF_u0 = 1 / BF_0u;

  // 順序制約つきベイズファクター（独立Betaのエンカプシング事前分布法, モンテカルロ）
  const nDraws = informedBinomState.nDraws;
  const priorProb = Stat.orderConstraintProb(() => rows.map(() => Stat.sampleBeta(a0, b0)), rankOrder, nDraws);
  const postProb = Stat.orderConstraintProb(() => rows.map(r => Stat.sampleBeta(a0 + r.x, b0 + (r.n - r.x))), rankOrder, nDraws);
  const priorProbSafe = Math.max(priorProb, 1 / nDraws);
  const postProbSafe = Math.max(postProb, 1 / nDraws);
  const BF_1u = postProbSafe / priorProbSafe;
  const BF_10 = BF_1u * BF_u0;

  const wU = 1, w1 = BF_1u, w0 = BF_0u;
  const wsum = wU + w1 + w0;
  const postProbU = wU / wsum, postProb1 = w1 / wsum, postProb0 = w0 / wsum;

  // 頻度論の代替: 隣接順位ペアの片側2標本比率検定（独立群、Intersection-Union法）
  const pairTests = [];
  for (let j = 0; j < rankOrder.length - 1; j++) {
    const i1 = rankOrder[j], i2 = rankOrder[j + 1];
    const p1 = pHat[i1], p2 = pHat[i2], n1 = rows[i1].n, n2 = rows[i2].n;
    const varDiff = p1 * (1 - p1) / n1 + p2 * (1 - p2) / n2;
    const zStat = varDiff > 0 ? (p1 - p2) / Math.sqrt(varDiff) : (p1 > p2 ? Infinity : 0);
    const pOneSided = 1 - Stat.normalCDF(zStat);
    pairTests.push({ nameHi: rows[i1].name, nameLo: rows[i2].name, p1, p2, z: zStat, p: pOneSided });
  }
  const iuP = Math.max(...pairTests.map(t => t.p));
  const iuSupported = iuP < alpha;

  const grid = el('div', { class: 'compare-grid' });
  const ptRows = pairTests.map(t => `${t.nameHi}(${fmt(t.p1, 3)}) > ${t.nameLo}(${fmt(t.p2, 3)}): z=${fmt(t.z, 2)}, p=${fmtp(t.p)}`);
  grid.appendChild(el('div', { class: 'panel freq' }, [
    el('div', { class: 'panel-head' }, [el('span', { class: 'tag' }, ['頻度論（代替）']), el('h3', {}, ['隣接順位の片側検定（Intersection-Union法）'])]),
    ...ptRows.map(r => el('div', { class: 'stat-line', style: 'font-size:12.5px;' }, [el('span', { class: 'k' }, [r])])),
    statLine('等質性のカイ二乗検定', `χ²(${cross.df}) = ${fmt(cross.chi2, 2)}, p = ${fmtp(cross.pChi2)}`),
    el('div', { class: 'verdict ' + (iuSupported ? 'good' : 'bad') }, [
      iuSupported
        ? `すべての隣接ペアが有意（最大p = ${fmtp(iuP)} < α = ${alpha}）→ 指定した順序仮説を支持`
        : `一部の隣接ペアが非有意（最大p = ${fmtp(iuP)} ≥ α = ${alpha}）→ 順序仮説を統計的に支持できない`
    ]),
  ]));
  grid.appendChild(el('div', { class: 'panel bayes' }, [
    el('div', { class: 'panel-head' }, [el('span', { class: 'tag' }, ['ベイズ']), el('h3', {}, ['独立Betaのエンカプシング事前分布法'])]),
    statLine('P(順序制約 | 事前分布)', fmt(priorProb, 4)),
    statLine('P(順序制約 | 事後分布)', fmt(postProb, 4)),
    statLine('BF₁ᵤ（順序制約 対 無制約）', fmt(BF_1u, 3)),
    statLine('BFᵤ₀（無制約 対 均等）', fmt(BF_u0, 3)),
    statLine('BF₁₀（順序制約 対 均等）', fmt(BF_10, 3)),
    statLine('事後モデル確率 [Hu, H₁順序, H₀均等]', `${pct(postProbU, 1)}, ${pct(postProb1, 1)}, ${pct(postProb0, 1)}`),
    el('div', { class: 'verdict ' + (BF_1u > 3 ? 'good' : (BF_1u < 1 / 3 ? 'bad' : '')) }, [
      BF_1u >= 1
        ? `データは順序制約仮説を無制約モデルの ${fmt(BF_1u, 2)} 倍支持 — ${kassRaftery(BF_1u)}`
        : `データは無制約モデルを順序制約仮説の ${fmt(1 / BF_1u, 2)} 倍支持 — ${kassRaftery(BF_1u)}`
    ]),
  ]));
  host.appendChild(grid);

  const mtable = el('table', { class: 'mtable' });
  mtable.appendChild(el('tr', {}, [el('th', {}, ['グループ']), el('th', {}, ['指定順位']), el('th', {}, ['n']), el('th', {}, ['x']), el('th', {}, ['観測比率']), el('th', {}, ['ベイズ事後平均']), el('th', {}, [`ベイズ${pct(1 - alpha, 0)}CrI`])]));
  rows.forEach((r, i) => {
    const aPost = a0 + r.x, bPost = b0 + (r.n - r.x);
    const mean = aPost / (aPost + bPost);
    const lo = Stat.betaQuantile(alpha / 2, aPost, bPost), hi = Stat.betaQuantile(1 - alpha / 2, aPost, bPost);
    mtable.appendChild(el('tr', {}, [
      el('td', {}, [r.name]), el('td', {}, [String(r.rank)]), el('td', {}, [String(r.n)]), el('td', {}, [String(r.x)]),
      el('td', {}, [fmt(pHat[i], 3)]), el('td', {}, [fmt(mean, 3)]), el('td', {}, [`[${fmt(lo, 3)}, ${fmt(hi, 3)}]`]),
    ]));
  });
  host.appendChild(el('div', { class: 'card' }, [el('h2', {}, ['グループ別の内訳']), mtable]));

  host.appendChild(el('div', { class: 'interp' }, [
    el('h4', {}, ['読み方']),
    el('div', { class: 'small-note' }, [
      '多重二項検定は、複数の「独立した」二項比率（例：異なる用量群の反応率）について順序仮説を検討する点が多項検定（1つの標本内でのカテゴリ構成比の比較）と異なります。頻度論の代替として、隣接する順位ペアごとに独立2標本比率のz検定（多項検定のような共分散項なし）を行い、すべて有意なら順序仮説を支持するとみなすIntersection-Union法を用いています。ベイズ側は各グループの比率を独立なBeta事後分布として推定し、',
      el('code', {}, ['Klugkist & Hoijtink (2007)']),
      ' のエンカプシング事前分布法により、指定した順序を満たす確率の事後/事前比としてベイズファクターBF₁ᵤを求めています。全グループに共通の事前分布 Beta(a₀,b₀) を用いることで、順序制約の事前確率が理論上 1/k!（kはグループ数）になる対称性を利用しています。'
    ])
  ]));

  const orderText = rankOrder.map(i => rows[i].name).join(' > ');
  const freqText = `${k}個の独立したグループ（合計 N = ${N}）について、順序仮説 ${orderText} を隣接順位ペアの片側検定（Intersection-Union法）で検討したところ、${iuSupported ? 'すべての隣接比較が有意であり（最大 p = ' + fmtp(iuP) + '）、指定した順序が統計的に支持された' : '一部の隣接比較が有意でなく（最大 p = ' + fmtp(iuP) + '）、指定した順序を統計的に支持する証拠は得られなかった'}。参考として、全グループの比率が等しいという帰無仮説に対するカイ二乗検定は χ²(${cross.df}) = ${fmt(cross.chi2, 2)}, p = ${fmtp(cross.pChi2)} であった。`;
  const bayesText = `ベイズ的分析では、エンカプシング事前分布法により、順序仮説 ${orderText} を支持するベイズファクターは無制約モデルに対して BF₁ᵤ = ${fmt(BF_1u, 3)}、均等モデルに対して BF₁₀ = ${fmt(BF_10, 3)} であり、${BF_1u >= 1 ? '順序仮説を支持する' : '順序仮説を支持しない'}${bfStrengthWord(BF_1u)}証拠と解釈された。`;
  host.appendChild(manuscriptExample(freqText, bayesText));

  const rCode = `# ==== データ ====
n_vec <- ${rVec(rows.map(r => r.n))}
x_vec <- ${rVec(rows.map(r => r.x))}
names(n_vec) <- names(x_vec) <- ${rVec(rows.map(r => r.name))}
factor_levels <- ${rVec(rows.map(r => r.name))}   # x_vec/n_vecと同じ並び順
# 指定した順序仮説（大きい順）: ${orderText}
alpha <- ${rNum(alpha)}

# ==== 頻度論（参考）: 等質性のカイ二乗検定 ====
tab <- cbind(success = x_vec, failure = n_vec - x_vec)
print(chisq.test(tab))

# ==== ベイズ: Informed 多重二項検定（multibridgeパッケージ） ====
if (!requireNamespace("multibridge", quietly = TRUE)) install.packages("multibridge", repos = "https://cloud.r-project.org")
library(multibridge)
# Hrは「小さい順」に "<" で連結して指定する
Hr <- ${buildMultibridgeHrVec(rows.map(r => r.name), rankOrder)}
result <- binom_bf_informed(x = x_vec, n = n_vec, Hr = Hr,
                             a = rep(${rNum(a0)}, length(x_vec)), b = rep(${rNum(b0)}, length(x_vec)),
                             factor_levels = factor_levels, seed = 1, niter = 5000)
summary(result)

# ==== 上記と同じ考え方の簡易実装（独立Betaのエンカプシング事前分布法） ====
set.seed(1)
draws <- ${rNum(nDraws, 0)}
k <- length(n_vec)
order_idx <- order(-c(${rankOrder.map(i => i + 1).join(', ')}))
prior_mat <- sapply(1:k, function(i) rbeta(draws, ${rNum(a0)}, ${rNum(b0)}))
post_mat  <- sapply(1:k, function(i) rbeta(draws, ${rNum(a0)} + x_vec[i], ${rNum(b0)} + (n_vec[i] - x_vec[i])))
check_order <- function(m) apply(m, 1, function(p) all(diff(p[order_idx]) < 0))
prior_p <- mean(check_order(prior_mat))
post_p  <- mean(check_order(post_mat))
cat("BF_1u:", post_p / prior_p, "\\n")
`;
  host.appendChild(rCodeBlock('Informed多重二項検定のRコード', rCode));
}
// ============================================================
// メイン: タブ切り替え & 初期化
// ============================================================
const Stat = window; // stats-core-embed.js の関数はグローバルに定義されている

function mountApp() {
  const main = document.getElementById('main');
  main.appendChild(renderBinomTab());
  const multiPanel = renderMultiTab(); multiPanel.id = 'panel-multi'; main.appendChild(multiPanel);
  const contPanel = renderContTab(); contPanel.id = 'panel-cont'; main.appendChild(contPanel);
  const loglinPanel = renderLoglinTab(); loglinPanel.id = 'panel-loglin'; main.appendChild(loglinPanel);
  main.appendChild(renderABTab());
  main.appendChild(renderInformedMultiTab());
  main.appendChild(renderInformedBinomTab());

  renderMultiTable();
  renderContTable();
  renderInformedMultiTable();
  renderInformedBinomTable();

  computeBinom();
  computeMulti();
  computeCont();
  computeLoglin();
  computeAB();
  computeInformedMulti();
  computeInformedBinom();

  document.getElementById('tabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.tab-btn');
    if (!btn) return;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    const targetId = {
      binom: 'panel-binom', multi: 'panel-multi', cont: 'panel-cont', loglin: 'panel-loglin',
      abtest: 'panel-abtest', informed_multi: 'panel-informed_multi', informed_binom: 'panel-informed_binom'
    }[tab];
    document.getElementById(targetId).classList.add('active');
    if (tab === 'loglin') computeLoglin(); // 分割表タブの最新データを反映
  });
}

document.addEventListener('DOMContentLoaded', mountApp);

</script>
