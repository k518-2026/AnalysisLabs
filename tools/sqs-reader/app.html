  $('#t-csv').onclick=exportWideCSV;
  $('#t-long').onclick=exportLongCSV;
  $('#t-demo').onclick=makeTestScans;
  $('#t-reset').onclick=()=>{
    if(!confirm('読み込んだ画像と処理結果をすべて破棄しますか?')) return;
    S.images=[]; S.results=[]; S.manual.clear(); S.truth=null; srcIndex=-1; S.cur=0;
    updateStatus(); renderStart(); showView('v-start');
  };
  $('#cfg-reset').onclick=()=>{ CFG=Object.assign({},CFG_DEFAULT); renderConfig(); updateStatus(); toast('初期値に戻しました'); };
  $('#btn-help').onclick=()=>{ $('#info-title').textContent='使い方'; $('#info-body').innerHTML=HELP_HTML; openModal('#m-info'); };
  $('#btn-about').onclick=()=>{ $('#info-title').textContent='このソフトについて'; $('#info-body').innerHTML=ABOUT_HTML; openModal('#m-info'); };
  $$('[data-close]').forEach(b=>b.onclick=closeModals);
  $$('.modal').forEach(m=>m.addEventListener('click',ev=>{ if(ev.target===m) closeModals(); }));

  /* ドラッグ＆ドロップ */
  document.addEventListener('dragover',ev=>{
    if(!ev.dataTransfer.types.includes('Files')) return;
    ev.preventDefault();
    const dz=$('#dropzone'); if(dz) dz.classList.add('hot');
  });
  document.addEventListener('dragleave',()=>{ const dz=$('#dropzone'); if(dz) dz.classList.remove('hot'); });
  document.addEventListener('drop',ev=>{
    if(!ev.dataTransfer.files.length) return;
    ev.preventDefault();
    const dz=$('#dropzone'); if(dz) dz.classList.remove('hot');
    const files=Array.from(ev.dataTransfer.files);
    const sqs=files.find(f=>/\.(sqs|xml)$/i.test(f.name));
    if(sqs) loadMasterFile(sqs);
    const imgs=files.filter(f=>/^image\//.test(f.type));
    if(imgs.length) loadScanFiles(imgs);
    if(!sqs && !imgs.length) toast('.sqs か画像ファイルを落としてください','err');
  });

  document.addEventListener('keydown',ev=>{
    if(/^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName)) return;
    if(ev.key==='Escape') closeModals();
    if(S.view==='v-detail' && S.images.length){
      if(ev.key==='ArrowLeft'){ S.cur=Math.max(0,S.cur-1); renderDetail(); }
      if(ev.key==='ArrowRight'){ S.cur=Math.min(S.images.length-1,S.cur+1); renderDetail(); }
    }
  });
  window.addEventListener('resize',()=>{ if(S.view==='v-detail') clearTimeout(window._rz),
    window._rz=setTimeout(renderDetail,200); });
}
function boot(){
  bindUI();
  renderStart();
  updateStatus();
}

<script>

/* ==========================================================================
   11. 集計結果一覧（元アプリの「チャート一覧」に相当）
   ========================================================================== */
function aggregate(){
  if(!S.master || !S.results.length) return [];
  const np = numPages(), N = numRespondents();
  const acc = new Map();   // qid -> {q, counts:Map(itemId->n), noAnswer, multi, answered}
  for(let r=0; r<N; r++){
    for(let p=0; p<np; p++){
      const ii = r*np + p;
      const rr = S.results[ii];
      if(!rr || rr.errors.length) continue;
      decideAllOnPage(ii, p).questions.forEach(({q,d})=>{
        let a = acc.get(q.qid);
        if(!a){ a = {q, counts:new Map(), noAnswer:0, multi:0, answered:0, total:0}; acc.set(q.qid, a); }
        a.total++;
        const sel = d.items.filter(x=>x.sel);
        if(q.qtype === 'select1'){
          if(d.state === 'nomark') a.noAnswer++;
          else if(d.state === 'double') a.multi++;
          else { a.answered++; a.counts.set(sel[0].m.id, (a.counts.get(sel[0].m.id)||0)+1); }
        }else{
          if(sel.length) a.answered++; else a.noAnswer++;
          sel.forEach(x=>a.counts.set(x.m.id, (a.counts.get(x.m.id)||0)+1));
        }
      });
    }
  }
  return [...acc.values()].sort((a,b)=>a.q.page-b.q.page || a.q.qno-b.q.qno ||
    a.q.qid.localeCompare(b.q.qid,'en',{numeric:true}));
}
function renderChart(){
  const b = $('#chartbody'); b.innerHTML='';
  if(!S.results.length){ b.innerHTML='<div class="note">まだ読み取っていません。</div>'; return; }
  const list = aggregate();
  if(!list.length){ b.innerHTML='<div class="note">集計できる設問がありません。</div>'; return; }

  const head = el('div');
  head.style.cssText='display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap';
  head.appendChild(Object.assign(el('div','note'),{
    textContent:`回答者 ${numRespondents()} 人 ／ 設問 ${list.length} 件。択一選択は「無回答」「多重回答エラー」を除いた回答を100%としています。`,
    style:'flex:1;min-width:220px;margin:0'}));
  const bt = el('button','tool','集計表をCSVで保存'); bt.onclick=exportAggCSV;
  head.appendChild(bt);
  b.appendChild(head);

  list.forEach(a=>{
    const q = a.q;
    const box = el('div','qblock');
    const hd = el('header');
    hd.appendChild(Object.assign(el('span','qid'),{textContent:q.qid}));
    const title = el('b');
    title.textContent = [q.rowHint, q.colHint].filter(Boolean).join(' ／ ') || (q.qhint||'').split('\n')[0];
    title.title = q.qhint||'';
    hd.appendChild(title);
    hd.appendChild(Object.assign(el('span','kind'),{
      textContent: q.qtype==='select1' ? '択一選択設問' : '複数選択設問'}));
    box.appendChild(hd);

    const bars = el('div','bars');
    const denom = q.qtype==='select1' ? Math.max(1,a.answered) : Math.max(1,a.total);
    const max = Math.max(1, ...q.items.map(it=>a.counts.get(it.id)||0));
    const bar = (label, n, cls)=>{
      const w = el('div','bar'+(cls?' '+cls:''));
      w.appendChild(Object.assign(el('div','lb'),{textContent:label, title:label}));
      const tr = el('div','tr'), fi = el('div','fi');
      fi.style.width = Math.round(n/Math.max(max, n||1)*100)+'%';
      tr.appendChild(fi); w.appendChild(tr);
      w.appendChild(Object.assign(el('div','nm'),{
        textContent: n+'人 ('+(denom?(n/denom*100).toFixed(1):'0.0')+'%)'}));
      bars.appendChild(w);
    };
    q.items.forEach(it=>bar((it.value?it.value+' ':'')+(it.label||'（無題）'), a.counts.get(it.id)||0));
    if(a.noAnswer) bar('無回答', a.noAnswer, 'na');
    if(a.multi)    bar('多重回答エラー', a.multi, 'me');
    const tw = el('div','bar tot');
    tw.appendChild(Object.assign(el('div','lb'),{textContent:'計'}));
    tw.appendChild(el('div','tr'));
    tw.appendChild(Object.assign(el('div','nm'),{
      textContent: (q.qtype==='select1' ? a.total : a.total)+'人'}));
    bars.appendChild(tw);
    box.appendChild(bars);
    b.appendChild(box);
  });
}
function exportAggCSV(){
  const out=[['qid','種別','設問文','行','列','選択肢の値','選択肢ラベル','人数','割合(%)']];
  aggregate().forEach(a=>{
    const q=a.q, denom = q.qtype==='select1' ? Math.max(1,a.answered) : Math.max(1,a.total);
    const flat = s => (s||'').replace(/\n/g,' ');
    q.items.forEach(it=>{
      const n=a.counts.get(it.id)||0;
      out.push([q.qid, q.qtype==='select1'?'択一選択':'複数選択', flat(q.qhint), flat(q.rowHint), flat(q.colHint),
        it.value, flat(it.label), n, (n/denom*100).toFixed(1)]);
    });
    if(a.noAnswer) out.push([q.qid,'','','','','','無回答',a.noAnswer,(a.noAnswer/Math.max(1,a.total)*100).toFixed(1)]);
    if(a.multi)    out.push([q.qid,'','','','','','多重回答エラー',a.multi,(a.multi/Math.max(1,a.total)*100).toFixed(1)]);
    out.push([q.qid,'','','','','','計',a.total,'']);
  });
  download(baseName()+'-集計表.csv','\ufeff'+toCSV(out),'text/csv');
  toast('集計表を書き出しました','ok');
}

let idCache={i:-1, data:null};
function sourceImageData(i){
  if(idCache.i===i && idCache.data) return idCache.data;
  const c = sourceCanvas(i);
  const d = c.getContext('2d',{willReadFrequently:true}).getImageData(0,0,c.width,c.height);
  idCache = {i, data:d};
  return d;
}
/* 版面上の矩形を、傾きを戻した画像として切り出す（cropImage 相当） */
function cropArea(imgIndex, H, rect, scale){
  const s = scale || 2;
  const [rx,ry,rw,rh] = rect;
  const W = Math.max(1, Math.round(rw*s)), Ht = Math.max(1, Math.round(rh*s));
  const src = sourceImageData(imgIndex);
  const cv = document.createElement('canvas'); cv.width=W; cv.height=Ht;
  const ctx = cv.getContext('2d');
  const out = ctx.createImageData(W,Ht);
  const sd = src.data, sw = src.width, sh = src.height;
  for(let j=0;j<Ht;j++){
    for(let i=0;i<W;i++){
      const [px,py] = project(H, rx + i/s, ry + j/s);
      const x = px|0, y = py|0;
      const o = (j*W+i)*4;
      if(x<0||y<0||x>=sw||y>=sh){ out.data[o]=out.data[o+1]=out.data[o+2]=255; out.data[o+3]=255; continue; }
      const q = (y*sw+x)*4;
      out.data[o]=sd[q]; out.data[o+1]=sd[q+1]; out.data[o+2]=sd[q+2]; out.data[o+3]=255;
    }
  }
  ctx.putImageData(out,0,0);
  return cv;
}
function freeAreaList(){
  if(!S.master) return [];
  const out=[];
  S.master.pages.forEach(p=>p.frees.forEach(f=>out.push(f)));
  return out.sort((a,b)=>a.page-b.page || a.qno-b.qno || a.qid.localeCompare(b.qid,'en',{numeric:true}));
}
function renderFree(){
  const b=$('#freebody'); b.innerHTML='';
  if(!S.results.length){ b.innerHTML='<div class="note">まだ読み取っていません。</div>'; return; }
  const areas=freeAreaList();
  if(!areas.length){ b.innerHTML='<div class="note">この調査票に自由記述欄はありません。</div>'; return; }
  b.appendChild(Object.assign(el('div','note'),{
    textContent:'スキャン画像から自由記述欄だけを切り出して並べています。傾きは補正済みです。'}));

  const np=numPages(), N=numRespondents();
  areas.forEach(f=>{
    const box=el('div','qblock');
    const hd=el('header');
    hd.appendChild(Object.assign(el('span','qid'),{textContent:f.qid}));
    const t=el('b'); t.textContent=(f.qhint||'').split('\n')[0]||'自由記述欄'; t.title=f.qhint||'';
    hd.appendChild(t);
    const sheet=el('button','tool','一覧を画像で保存');
    sheet.onclick=()=>exportContactSheet(f);
    hd.appendChild(sheet);
    box.appendChild(hd);

    const grid=el('div','freegrid'); grid.style.padding='9px 12px 11px';
    let shown=0;
    for(let r=0;r<N;r++){
      const ii=r*np+f.page, rr=S.results[ii];
      const row=el('div','freerow');
      row.appendChild(Object.assign(el('div','id'),{textContent:'#'+(r+1)}));
      if(!rr || rr.errors.length || !rr.H){
        row.appendChild(Object.assign(el('div','note'),{
          textContent: rr && rr.errors.length ? '読み取りエラーのため切り出せません' : '未処理',
          style:'margin:0;flex:1'}));
      }else{
        const holder=el('div'); holder.style.cssText='flex:1;min-width:0';
        row.appendChild(holder);
        /* 大量にあると重いので、順に描く */
        const draw=()=>{
          try{
            const cv=cropArea(ii, rr.H, [f.x,f.y,f.w,f.h], 2);
            cv.style.width=Math.min(760, f.w*1.6)+'px';
            holder.appendChild(cv);
          }catch(e){ holder.appendChild(Object.assign(el('div','note'),{textContent:'切り出しに失敗しました',style:'margin:0'})); }
        };
        if(shown<6) draw(); else setTimeout(draw, (shown-5)*12);
        shown++;
      }
      grid.appendChild(row);
    }
    box.appendChild(grid);
    b.appendChild(box);
  });
}
function exportContactSheet(f){
  const np=numPages(), N=numRespondents();
  const s=2, cw=Math.round(f.w*s), ch=Math.round(f.h*s), gap=6, lab=34;
  const rows=[];
  for(let r=0;r<N;r++){
    const ii=r*np+f.page, rr=S.results[ii];
    if(!rr || rr.errors.length || !rr.H) continue;
    rows.push({r, cv:cropArea(ii, rr.H, [f.x,f.y,f.w,f.h], s)});
  }
  if(!rows.length){ toast('切り出せる画像がありません','err'); return; }
  const W=lab+cw+gap*2, H=28+rows.length*(ch+gap)+gap;
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const cx=cv.getContext('2d');
  cx.fillStyle='#fff'; cx.fillRect(0,0,W,H);
  cx.fillStyle='#14161a'; cx.font='bold 13px sans-serif';
  cx.fillText((f.qhint||'自由記述欄').split('\n')[0].slice(0,60), gap, 19);
  rows.forEach((it,k)=>{
    const y=28+k*(ch+gap);
    cx.fillStyle='#69737f'; cx.font='11px ui-monospace,monospace';
    cx.fillText('#'+(it.r+1), gap, y+14);
    cx.drawImage(it.cv, lab, y);
    cx.strokeStyle='#c6ccd4'; cx.lineWidth=1;
    cx.strokeRect(lab+0.5, y+0.5, cw, ch);
  });
  cv.toBlob(bl=>{
    const url=URL.createObjectURL(bl), a=document.createElement('a');
    a.href=url; a.download=baseName()+'-'+f.qid+'-自由記述欄.png';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
    toast('自由記述欄の一覧を保存しました','ok');
  },'image/png');
}

/* ==========================================================================
   13. マスタの保存と読み込み（元アプリの .sqm に相当するもの）
   ========================================================================== */
function exportMaster(){
  if(!S.master){ toast('先に調査票を読み込んでください','err'); return; }
  const m=S.master;
  const obj={
    format:'sqs-markreader-master', version:1,
    title:m.title, source:S.masterName, numPages:m.numPages,
    page:{width:MASTER.W, height:MASTER.H},
    guideCenters:MASTER.guideCenters,
    footerLeftRect:MASTER.footerLeftRect, footerRightRect:MASTER.footerRightRect,
    pages:m.pages.map(p=>({
      index:p.index, side:p.side,
      marks:p.marks.map(k=>({id:k.id,page:k.page,qid:k.qid,qtype:k.qtype,qno:k.qno,qhint:k.qhint,
        itemIndex:k.itemIndex,value:k.value,label:k.label,
        rowIndex:k.rowIndex,rowHint:k.rowHint,colHint:k.colHint,
        x:+k.x.toFixed(3),y:+k.y.toFixed(3),w:+k.w.toFixed(3),h:+k.h.toFixed(3)})),
      frees:p.frees.map(k=>({id:k.id,page:k.page,qid:k.qid,qno:k.qno,qhint:k.qhint,
        x:+k.x.toFixed(3),y:+k.y.toFixed(3),w:+k.w.toFixed(3),h:+k.h.toFixed(3)}))
    }))
  };
  download((m.title||'調査票').replace(/\.[^.]+$/,'')+'-マスタ.json',
    JSON.stringify(obj,null,1),'application/json');
  toast('マスタを保存しました','ok');
}
function loadMasterJSON(text, name){
  const o=JSON.parse(text);
  if(o.format!=='sqs-markreader-master') throw new Error('マスタファイルの形式が違います');
  const master={numPages:o.numPages, pages:o.pages, questions:new Map(), title:o.title||''};
  master.pages.forEach(p=>{
    p.marks=p.marks||[]; p.frees=p.frees||[];
    p.marks.forEach(m=>{ if(m.page==null) m.page=p.index; });
    p.frees.forEach(f=>{ if(f.page==null) f.page=p.index; });
  });
  master.pages.forEach(p=>p.marks.forEach(m=>{
    if(!master.questions.has(m.qid))
      master.questions.set(m.qid,{qid:m.qid,qtype:m.qtype,qno:m.qno,qhint:m.qhint,
        rowHint:m.rowHint,colHint:m.colHint,page:m.page!=null?m.page:p.index,items:[]});
    master.questions.get(m.qid).items.push(m);
    if(m.page==null) m.page=p.index;
  }));
  master.questions.forEach(q=>q.items.sort((a,b)=>a.itemIndex-b.itemIndex));
  master.numMarks=master.pages.reduce((s,p)=>s+p.marks.length,0);
  if(o.guideCenters) MASTER.guideCenters=o.guideCenters;
  if(o.footerLeftRect) MASTER.footerLeftRect=o.footerLeftRect;
  if(o.footerRightRect) MASTER.footerRightRect=o.footerRightRect;
  if(o.page){ MASTER.W=o.page.width; MASTER.H=o.page.height; }
  S.master=master; S.masterName=name; S.docTitle=master.title;
  S.results=[]; S.manual.clear(); S.truth=null;
  updateStatus(); renderStart();
  toast(`マスタを読み込みました（${master.numPages}ページ・マーク欄${master.numMarks}個）`,'ok');
}

/* ==========================================================================
   14. 追加ぶんの結線と起動
   ========================================================================== */
(function(){
  /* showView を拡張 */
  const base = showView;
  showView = function(id){
    base(id);
    if(id==='v-chart') renderChart();
    if(id==='v-free')  renderFree();
  };
  /* ファイル読み込みを .json 対応に */
  const baseLoad = loadMasterFile;
  loadMasterFile = function(file){
    if(/\.json$/i.test(file.name)){
      const rd=new FileReader();
      rd.onload=()=>{ try{ loadMasterJSON(String(rd.result), file.name); }
                      catch(e){ toast(e.message||'読み込みに失敗しました','err'); } };
      rd.readAsText(file,'UTF-8');
      return;
    }
    baseLoad(file);
  };
  /* 画像を差し替えたら切り出しのキャッシュも捨てる */
  const baseRun = runSession;
  runSession = function(){ idCache={i:-1,data:null}; return baseRun(); };
})();

function boot2(){
  bindUI();
  $('#t-mout').onclick = exportMaster;
  $$('.tab').forEach(t=>t.onclick=()=>showView(t.dataset.view));
  renderStart();
  updateStatus();
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot2);
else boot2();
</script>
