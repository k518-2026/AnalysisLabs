<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ファイル統合 — データ分析ラボ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/encoding-japanese/2.0.0/encoding.min.js"></script>
  <style>
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- データ分析ラボ：共通の書体・配色・バー（scripts/import.js が追加） -->
<link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../assets/tokens.css?v=91cc935c">
<link rel="stylesheet" href="../../assets/app-bar.css?v=c019fc8a">
<style id="al-theme">:root{--al-cat:var(--al-c-prep);}body{font-family:var(--al-sans)}</style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-200 text-slate-800 min-h-screen py-10 px-4 font-sans antialiased">
<div class="al-bar" role="navigation" aria-label="データ分析ラボ"><a class="al-brand" href="../../"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="1" y="1" width="22" height="22" rx="5" fill="#F3F1EA"/><path d="M6.5 17.5v-4M10.2 17.5V8.5M13.9 17.5v-6M17.6 17.5v-11" stroke="#1B2320" stroke-width="2.3" stroke-linecap="round"/></svg><span>データ分析ラボ</span></a><span class="al-sep al-s1">/</span><a class="al-crumb" href="../../#prep">データの準備</a><span class="al-sep">/</span><span class="al-here"><i class="al-dot"></i>ファイル統合</span><span class="al-gap"></span><a class="al-link" href="./">説明</a></div>

  <div class="max-w-5xl mx-auto bg-white/90 backdrop-blur-md rounded-3xl shadow-xl border border-white p-8">
    
    <header class="text-center mb-10">
      <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-blue-500 tracking-tight">Smart Document Merger</h1>
      <p class="text-sm text-slate-500 mt-2 font-medium">PDF, Excel, Word, およびあらゆるテキストデータを自動分類して結合</p>
    </header>

    <div id="dropZone" class="group relative border-2 border-dashed border-indigo-200 bg-indigo-50/50 rounded-2xl p-10 text-center cursor-pointer hover:bg-indigo-50 hover:border-indigo-400 transition-all duration-300 mb-8">
      <input type="file" id="fileInput" multiple accept=".pdf,.xlsx,.xls,.docx,text/*,.txt,.csv,.log,.md,.json,.xml,.ini" class="hidden">
      <div class="relative z-10 flex flex-col items-center justify-center">
        <div class="text-lg font-bold text-slate-700">クリック または ファイルをドロップ</div>
        <div class="text-xs text-slate-400 mt-2 font-medium">PDF / Excel / Word / Text, CSV, Log, MD など</div>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

      <!-- PDF -->
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 flex flex-col">
        <div class="bg-rose-50 p-3 border-b border-rose-100 flex justify-between items-center">
          <h2 class="text-sm font-bold text-slate-800">PDF Documents (<span id="count-pdf">0</span>)</h2>
          <button onclick="clearCategory('pdf')" class="text-xs text-rose-500 hover:underline">クリア</button>
        </div>
        <div class="p-4 flex-grow flex flex-col">
          <ul id="list-pdf" class="flex-grow space-y-2 min-h-[120px] max-h-[160px] overflow-y-auto"></ul>
          <button id="btn-pdf" disabled onclick="mergePDF()" class="mt-4 w-full py-2.5 bg-rose-600 hover:bg-rose-700 disabled:bg-slate-200 disabled:text-slate-400 text-white rounded-xl text-sm font-bold transition flex justify-center items-center gap-2">
            <span>PDFを結合する</span>
            <div class="loader hidden w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
          </button>
        </div>
      </div>

      <!-- Excel -->
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 flex flex-col">
        <div class="bg-emerald-50 p-3 border-b border-emerald-100 flex justify-between items-center">
          <h2 class="text-sm font-bold text-slate-800">Excel (<span id="count-xlsx">0</span>)</h2>
          <button onclick="clearCategory('xlsx')" class="text-xs text-emerald-500 hover:underline">クリア</button>
        </div>
        <div class="p-4 flex-grow flex flex-col">
          <div class="mb-3 bg-slate-100 p-1 rounded-lg flex text-xs font-medium">
            <label class="flex-1 text-center cursor-pointer relative">
              <input type="radio" name="excelMode" value="sheets" class="peer sr-only" checked>
              <div class="py-1.5 rounded-md peer-checked:bg-white peer-checked:shadow-sm peer-checked:text-emerald-700 text-slate-500 transition-all">シートを分ける</div>
            </label>
            <label class="flex-1 text-center cursor-pointer relative">
              <input type="radio" name="excelMode" value="concat" class="peer sr-only">
              <div class="py-1.5 rounded-md peer-checked:bg-white peer-checked:shadow-sm peer-checked:text-emerald-700 text-slate-500 transition-all">縦に繋げる(1シート)</div>
            </label>
          </div>
          <ul id="list-xlsx" class="flex-grow space-y-2 min-h-[85px] max-h-[125px] overflow-y-auto"></ul>
          <button id="btn-xlsx" disabled onclick="mergeExcel()" class="mt-4 w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-200 disabled:text-slate-400 text-white rounded-xl text-sm font-bold transition flex justify-center items-center gap-2">
            <span>Excelを結合する</span>
            <div class="loader hidden w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
          </button>
        </div>
      </div>

      <!-- Word -->
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 flex flex-col">
        <div class="bg-blue-50 p-3 border-b border-blue-100 flex justify-between items-center">
          <h2 class="text-sm font-bold text-slate-800">Word (<span id="count-docx">0</span>)</h2>
          <button onclick="clearCategory('docx')" class="text-xs text-blue-500 hover:underline">クリア</button>
        </div>
        <div class="p-4 flex-grow flex flex-col">
          <ul id="list-docx" class="flex-grow space-y-2 min-h-[120px] max-h-[160px] overflow-y-auto"></ul>
          <button id="btn-docx" disabled onclick="mergeWord()" class="mt-4 w-full py-2.5 bg-blue-600 hover:bg-blue-700 disabled:bg-slate-200 disabled:text-slate-400 text-white rounded-xl text-sm font-bold transition flex justify-center items-center gap-2">
            <span>Wordを結合する</span>
            <div class="loader hidden w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
          </button>
        </div>
      </div>

      <!-- Text / Logs / CSV -->
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 flex flex-col">
        <div class="bg-slate-100 p-3 border-b border-slate-200 flex justify-between items-center">
          <h2 class="text-sm font-bold text-slate-800">Text / Logs / CSV (<span id="count-txt">0</span>)</h2>
          <button onclick="clearCategory('txt')" class="text-xs text-slate-500 hover:underline">クリア</button>
        </div>
        <div class="p-4 flex-grow flex flex-col">
          <ul id="list-txt" class="flex-grow space-y-2 min-h-[120px] max-h-[160px] overflow-y-auto"></ul>
          <button id="btn-txt" disabled onclick="mergeTXT()" class="mt-4 w-full py-2.5 bg-slate-700 hover:bg-slate-800 disabled:bg-slate-200 disabled:text-slate-400 text-white rounded-xl text-sm font-bold transition flex justify-center items-center gap-2" title="文字コードを自動判定し、BOM付きUTF-8で出力します">
            <span>テキストデータを結合</span>
            <div class="loader hidden w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
          </button>
        </div>
      </div>

    </div>
  </div>

  <script>
    const store = { pdf: [], xlsx: [], docx: [], txt: [] };
    const btnLabels = { pdf: 'PDF', xlsx: 'Excel', docx: 'Word', txt: 'テキストデータ' };
    const textExtensions = ['txt', 'csv', 'log', 'md', 'json', 'xml', 'ini', 'sql', 'html', 'js', 'css'];

    function renderAll() {
      ['pdf', 'xlsx', 'docx', 'txt'].forEach(type => {
        const listEl = document.getElementById(`list-${type}`);
        document.getElementById(`count-${type}`).textContent = store[type].length;
        document.getElementById(`btn-${type}`).disabled = store[type].length < 2;

        listEl.innerHTML = '';
        if (store[type].length === 0) {
          listEl.innerHTML = `<div class="text-center text-slate-300 text-xs py-6">ファイルがありません</div>`;
        } else {
          store[type].forEach((file, idx) => {
            const li = document.createElement('li');
            li.setAttribute('data-id', file._id);
            li.className = 'flex items-center justify-between p-2 bg-slate-50 border border-slate-100 rounded text-xs cursor-grab';
            li.innerHTML = `
              <div class="truncate pr-2"><span class="text-slate-400 mr-2">☰</span>${idx + 1}. ${file.name}</div>
              <button onclick="removeFile('${type}', '${file._id}')" class="text-rose-400 font-bold px-1">✕</button>
            `;
            listEl.appendChild(li);
          });
        }
      });
    }

    function toggleLoading(type, isLoading) {
      const btn = document.getElementById(`btn-${type}`);
      const loader = btn.querySelector('.loader');
      const text = btn.querySelector('span');
      if (isLoading) {
        btn.disabled = true;
        loader.classList.remove('hidden');
        text.textContent = '処理中...';
      } else {
        btn.disabled = store[type].length < 2;
        loader.classList.add('hidden');
        text.textContent = `${btnLabels[type]}を結合する`;
      }
    }

    async function mergePDF() {
      toggleLoading('pdf', true);
      try {
        const mergedPdf = await PDFLib.PDFDocument.create();
        for (const file of store.pdf) {
          const bytes = await file.arrayBuffer();
          const pdf = await PDFLib.PDFDocument.load(bytes, { ignoreEncryption: true });
          const pages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
          pages.forEach(p => mergedPdf.addPage(p));
        }
        const mergedBytes = await mergedPdf.save();
        downloadBlob(new Blob([mergedBytes], { type: 'application/pdf' }), `merged_${Date.now()}.pdf`);
      } catch(e) { alert('【PDF結合エラー】'); } finally { toggleLoading('pdf', false); }
    }

    async function mergeExcel() {
      toggleLoading('xlsx', true);
      try {
        const mode = document.querySelector('input[name="excelMode"]:checked').value;
        const newWb = XLSX.utils.book_new();

        if (mode === 'sheets') {
          const existingNames = new Set();
          for (const file of store.xlsx) {
            const data = await file.arrayBuffer();
            const wb = XLSX.read(data, { type: 'array' });
            const baseName = file.name.replace(/\.[^/.]+$/, "").substring(0, 10);
            wb.SheetNames.forEach(sheetName => {
              let finalName = `${baseName}_${sheetName}`.substring(0, 31);
              let counter = 1;
              while (existingNames.has(finalName)) {
                finalName = `${baseName.substring(0, 8)}_${counter}_${sheetName}`.substring(0, 31);
                counter++;
              }
              existingNames.add(finalName);
              XLSX.utils.book_append_sheet(newWb, wb.Sheets[sheetName], finalName);
            });
          }
        } else {
          let combinedData = [];
          let isFirstValidSheet = true;
          for (const file of store.xlsx) {
            const data = await file.arrayBuffer();
            const wb = XLSX.read(data, { type: 'array' });
            wb.SheetNames.forEach(sheetName => {
              const sheet = wb.Sheets[sheetName];
              const aoa = XLSX.utils.sheet_to_json(sheet, { header: 1 });
              if (aoa.length === 0) return;
              if (isFirstValidSheet) {
                combinedData.push(["元ファイル/シート名", ...(aoa[0] || [])]);
                for (let i = 1; i < aoa.length; i++) if (aoa[i].length > 0) combinedData.push([`${file.name} (${sheetName})`, ...aoa[i]]);
                isFirstValidSheet = false;
              } else {
                for (let i = 1; i < aoa.length; i++) if (aoa[i].length > 0) combinedData.push([`${file.name} (${sheetName})`, ...aoa[i]]);
              }
            });
          }
          XLSX.utils.book_append_sheet(newWb, XLSX.utils.aoa_to_sheet(combinedData), "統合データ");
        }
        const out = XLSX.write(newWb, { bookType: 'xlsx', type: 'array' });
        downloadBlob(new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), `merged_${Date.now()}.xlsx`);
      } catch(e) { alert('【Excelエラー】'); } finally { toggleLoading('xlsx', false); }
    }

    async function mergeWord() {
      toggleLoading('docx', true);
      try {
        const baseZip = await JSZip.loadAsync(await store.docx[0].arrayBuffer());
        let baseDocXml = await baseZip.file("word/document.xml").async("string");
        const bodyEndIdx = baseDocXml.lastIndexOf("</w:body>");
        let combinedBodyContent = baseDocXml.substring(0, bodyEndIdx);
        for (let i = 1; i < store.docx.length; i++) {
          const nextZip = await JSZip.loadAsync(await store.docx[i].arrayBuffer());
          const nextXml = await nextZip.file("word/document.xml").async("string");
          const start = nextXml.indexOf("<w:body>") + 8;
          const end = nextXml.lastIndexOf("</w:body>");
          if (start > 7 && end > start) combinedBodyContent += `<w:p><w:r><w:br w:type="page"/></w:r></w:p>` + nextXml.substring(start, end);
        }
        baseZip.file("word/document.xml", combinedBodyContent + "</w:body></w:document>");
        downloadBlob(await baseZip.generateAsync({ type: "blob" }), `merged_${Date.now()}.docx`);
      } catch(e) { alert('【Wordエラー】'); } finally { toggleLoading('docx', false); }
    }

    async function mergeTXT() {
      toggleLoading('txt', true);
      try {
        let combinedText = '';
        const isAllCSV = store.txt.every(f => f.name.toLowerCase().endsWith('.csv'));
        const isAllMD = store.txt.every(f => f.name.toLowerCase().endsWith('.md'));
        const outputExt = isAllCSV ? 'csv' : (isAllMD ? 'md' : 'txt');

        for (const file of store.txt) {
          const buffer = await file.arrayBuffer();
          const uint8Array = new Uint8Array(buffer);
          let detected = Encoding.detect(uint8Array);
          if (!detected || detected === 'BINARY') { detected = 'UTF8'; }

          let text = Encoding.convert(uint8Array, { to: 'UNICODE', from: detected, type: 'string' });
          if (!text.endsWith('\n')) text += '\n';

          if (isAllCSV) {
            combinedText += text;
          } else {
            const separator = `\n\n========================================\n【ファイル名: ${file.name} (元エンコード: ${detected})】\n========================================\n\n`;
            combinedText += (combinedText === '' ? `【ファイル名: ${file.name} (元エンコード: ${detected})】\n========================================\n\n` : separator) + text;
          }
        }

        const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
        const utf8Array = Encoding.convert(combinedText, { to: 'UTF8', from: 'UNICODE', type: 'array' });
        const blob = new Blob([bom, new Uint8Array(utf8Array)], { type: 'text/plain;charset=utf-8' });
        downloadBlob(blob, `merged_${Date.now()}.${outputExt}`);

      } catch(e) { alert('【テキスト結合エラー】処理中に予期せぬエラーが発生しました。'); } finally { toggleLoading('txt', false); }
    }

    function categorizeFiles(files) {
      Array.from(files).forEach(file => {
        const ext = file.name.split('.').pop().toLowerCase();
        let cat = null;
        if (ext === 'pdf') { cat = 'pdf'; } 
        else if (['xlsx', 'xls'].includes(ext)) { cat = 'xlsx'; } 
        else if (ext === 'docx') { cat = 'docx'; } 
        else if (file.type.startsWith('text/') || textExtensions.includes(ext)) { cat = 'txt'; }
        
        if (cat) { 
          file._id = Math.random().toString(36).substring(2, 9); 
          store[cat].push(file); 
        }
      });
      renderAll();
    }
    
    function removeFile(type, id) { store[type] = store[type].filter(f => f._id !== id); renderAll(); }
    function clearCategory(type) { store[type] = []; renderAll(); }
    
    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob); 
      const a = document.createElement('a');
      a.href = url; 
      a.download = filename; 
      // GAS環境対応: bodyにアペンドしてからクリックしないとブロックされる場合がある
      document.body.appendChild(a);
      a.click(); 
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => { categorizeFiles(e.target.files); fileInput.value = ''; });
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('border-indigo-400'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('border-indigo-400'));
    dropZone.addEventListener('drop', (e) => { e.preventDefault(); dropZone.classList.remove('border-indigo-400'); categorizeFiles(e.dataTransfer.files); });

    ['pdf', 'xlsx', 'docx', 'txt'].forEach(type => {
      new Sortable(document.getElementById(`list-${type}`), {
        animation: 150, handle: '.cursor-grab',
        onEnd: () => {
          const listEl = document.getElementById(`list-${type}`);
          const newOrder = [];
          listEl.querySelectorAll('li[data-id]').forEach(el => {
            const file = store[type].find(f => f._id === el.getAttribute('data-id'));
            if (file) newOrder.push(file);
          });
          store[type] = newOrder; renderAll();
        }
      });
    });
    renderAll();
  </script>
</body>
</html>
